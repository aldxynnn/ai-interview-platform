name: CI

on:
  push:
    branches:
      - main
      - "take-home/**"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: API specs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rakamin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rakamin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: ci-only-secret-key-not-for-production
      GEMINI_API_KEY: ci-test-key-not-for-live-requests
      GEMINI_FLASH_MODEL: gemini-2.0-flash-001
      GEMINI_PRO_MODEL: gemini-2.5-pro
      GEMINI_LIVE_MODEL: gemini-3.1-flash-live-preview
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://127.0.0.1:6379/1
      ALLOWED_ORIGINS: http://localhost:5173
      APP_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.2"
          bundler-cache: true
      - name: Prepare test database
        run: bundle exec rails db:prepare
      - name: Run RSpec
        run: bundle exec rspec

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run component tests
        run: npm test
      - name: Type-check and build
        run: npm run build
