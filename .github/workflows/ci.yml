name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/trustworthy-fit-gap]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install
      - name: Run component tests
        run: npm run test
      - name: Build frontend
        run: npm run build

  backend:
    name: API RSpec
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rakamin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rakamin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: 1234567890123456789012345678901234567890123456789012345678901234
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: rakamin_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      GEMINI_API_KEY: test-placeholder-not-a-real-key
      GEMINI_FLASH_MODEL: gemini-2.0-flash-001
      REDIS_URL: redis://localhost:6379/1
      ALLOWED_ORIGINS: http://localhost:5173
      APP_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.2
          bundler-cache: true
      - name: Load database schema
        run: bundle exec rails db:schema:load
      - name: Run RSpec
        run: bundle exec rspec
