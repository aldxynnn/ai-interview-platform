name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, feat-fitgap-calibration-revamp]

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  backend-rspec:
    name: Backend RSpec
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rakamin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rakamin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: ci-test-only-secret-key-base-not-for-production-0123456789abcdef
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_NAME: rakamin_test
      DB_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379/0
      ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.2
          bundler-cache: true
          working-directory: api
      - name: Prepare test database
        run: bundle exec rails db:prepare
      - name: Run RSpec
        run: bundle exec rspec
