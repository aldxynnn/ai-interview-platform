name: CI

on:
  push:
    branches: ["main", "take-home/**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      ALLOWED_ORIGINS: http://localhost:5173
      SECRET_KEY_BASE: test-only-secret-key-base-for-ci
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: ai_interview_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.2"
          bundler-cache: true
          working-directory: api
      - name: Run API specs
        run: bundle exec rspec

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web dependencies
        run: npm install
      - name: Type-check and production build
        run: npm run build
