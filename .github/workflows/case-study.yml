name: Case Study Checks

on:
  push:
    branches: [main, "feat/case-study"]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build

  api:
    name: API regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.2"
      - run: bundle install
      - run: bundle exec rspec

  ui-evidence:
    name: Capture candidate UX evidence
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build with deterministic local service endpoints
        run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:4173/api/v1
          VITE_WS_BASE_URL: ws://127.0.0.1:4173
          VITE_SPEED_TEST_PING_URL: /mock-ping
          VITE_SPEED_TEST_UPLOAD_URL: /mock-upload
      - name: Install Chromium for screenshots
        run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ai-interview-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ai-interview-preview.log
          exit 1
      - name: Capture failure, mobile, and completion states
        run: node scripts/capture-case-study-ui.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: case-study-ui-screenshots
          path: web/evidence/*.png
          if-no-files-found: error
          retention-days: 14
